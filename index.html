<!doctype html>
<html lang="bn">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Español ভান্ডার – Español to বাংলা</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%
    }

    :root {
      --h: 68px
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: Inter, "Segoe UI", "Noto Sans Bengali", "Kalpurush", Arial, sans-serif;
      background: linear-gradient(135deg, #edf9f6, #d8f1eb);
      color: #173c3a;
      -webkit-font-smoothing: antialiased
    }

    /* ---------- Header (same design as SEC EEE CGPA Dashboard) ---------- */
    .header-stage {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: max(8px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) 0 max(22px, env(safe-area-inset-left));
    }

    header {
      position: relative;
      overflow: hidden;
      max-width: 1600px;
      margin: 0 auto;
      padding: 8px 18px;
      background: #ffffffcf;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #ffffffb0;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(15, 60, 58, .05), 0 18px 40px -12px rgba(15, 60, 58, .18);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      transition: padding .25s ease, box-shadow .25s ease, border-radius .25s ease;
    }

    header::before,
    header::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(30px);
      pointer-events: none;
      z-index: 0;
    }

    header::before {
      width: 180px;
      height: 180px;
      background: #2ac3b5;
      opacity: .18;
      top: -90px;
      left: -40px;
    }

    header::after {
      width: 160px;
      height: 160px;
      background: #0f9d8f;
      opacity: .16;
      bottom: -100px;
      right: 10%;
    }

    .header-stage.scrolled header {
      box-shadow: 0 6px 14px rgba(15, 60, 58, .08), 0 22px 44px -14px rgba(15, 60, 58, .22);
    }

        .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1 1 auto;
      position: relative;
      z-index: 1;
    }

    .brand-mark {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0f9d8f, #2ac3b5);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px -4px rgba(15, 157, 143, .55);
    }

    .brand-text {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -.4px;
      background: linear-gradient(135deg, #0f766e, #14a89a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      line-height: 1.2;
      color: #557471;
      font-weight: 600;
      margin-top: 1px;
      opacity: .85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .header-right .btn {
      padding: 8px 14px;
    }

    /* ---------- Buttons ---------- */
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: background .15s, transform .1s
    }

    button:active {
      transform: scale(.96)
    }

    .btn {
      background: #1fb4a6;
      color: #fff;
      border-radius: 13px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px
    }

    .btn:hover {
      background: #0f766e;
    }

    .ghost {
      background: #e8fbf8;
      color: #0f766e;
      border: 1px solid #8bd8cd
    }

    .ghost:hover {
      background: #1fb4a6;
      color: #fff;
    }

    .danger {
      background: #fff1f2;
      color: #b91c1c;
      border: 1px solid #fecdd3
    }

    .danger:hover {
      background: #dc2626;
      color: #fff;
    }

    /* ---------- Layout ---------- */
    main {
      flex: 1;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 max(20px, env(safe-area-inset-left)) 0 max(20px, env(safe-area-inset-right))
    }

    .top {
      min-height: calc(100vh - var(--h));
      min-height: calc(100dvh - var(--h));
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2vh, 18px);
      padding: clamp(10px, 2.5vh, 24px) 0 clamp(12px, 2.5vh, 22px)
    }

    .mid {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 2.4vh, 20px)
    }

    .cards {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2vw, 18px)
    }

    .card {
      flex: 1;
      height: clamp(120px, 24vh, 210px);
      background: #ffffffd4;
      border: 1px solid #cde7e2;
      border-radius: 26px;
      box-shadow: 0 10px 30px rgba(16, 118, 110, .09);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      position: relative;
      overflow: hidden
    }

    .card small {
      position: absolute;
      top: 12px;
      left: 18px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #557471;
      text-transform: uppercase
    }

    .txt {
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 800;
      color: #0f766e;
      line-height: 1.2;
      word-break: break-word
    }

    .txt.hint {
      font-size: clamp(15px, 2.5vw, 20px);
      font-weight: 600;
      color: #7fa9a4
    }

    .mean {
      background: linear-gradient(135deg, #0f9d8f, #2ac3b5);
      border: none
    }

    .mean small,
    .mean .txt {
      color: #fff
    }

    .mean .q {
      display: none;
      font-size: clamp(40px, 7vw, 64px);
      font-weight: 800;
      color: #ffffffb0
    }

    .mean.covered .txt {
      visibility: hidden
    }

    .mean.covered .q {
      display: block;
      position: absolute
    }

    .arrow {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ddf7f1;
      color: #0f766e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      flex-shrink: 0
    }

    .prog {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .track {
      flex: 1;
      height: 12px;
      border-radius: 999px;
      background: #cfe7e3;
      overflow: hidden
    }

    .bar {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #0f9d8f, #2ac3b5);
      transition: width .45s cubic-bezier(.4, 0, .2, 1)
    }

    .count {
      font-size: 13px;
      font-weight: 700;
      color: #0f766e;
      min-width: 44px;
      text-align: right
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px
    }

    .row .btn {
      flex: 1 1 200px;
      font-size: 14px
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: clamp(2px, 1vh, 10px)
    }

.tools .btn {
      width: 100%;
      max-width: none;
    }

    a.btn {
      text-decoration: none
    }

    .yt {
      width: 20px;
      height: 14px;
      flex-shrink: 0;
      display: block
    }

    .toggle {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: #e8fbf8;
      color: #0f766e;
      border: 1px solid #8bd8cd;
      font-weight: 700;
      font-size: 13px
    }

    .toggle:hover {
      background: #d8f5ef
    }

    #panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows .6s cubic-bezier(.4, 0, .2, 1), opacity .6s ease, visibility 0s linear .6s
    }

    body.open #panel {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      transition: grid-template-rows .6s cubic-bezier(.4, 0, .2, 1), opacity .6s ease, visibility 0s
    }

    .panel-inner {
      overflow: hidden;
      min-height: 0
    }

    .panel-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 6px 4px 48px
    }

    @media (prefers-reduced-motion: reduce) {

      #panel,
      body.open #panel {
        transition: none
      }
    }

    .add {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .add input {
      flex: 1 1 180px;
      border: 1px solid #cde7e2;
      border-radius: 13px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: #173c3a
    }

    .add input:focus {
      outline: none;
      border-color: #2ac3b5;
      box-shadow: 0 0 0 3px #2ac3b530
    }

    .add .btn {
      flex: 0 0 auto
    }

    #list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px
    }

    .chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #ffffffd4;
      border: 1px solid #cfe7e3;
      border-radius: 16px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600
    }

    .chip span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .chip.on {
      background: #ddf7f1;
      border-color: #2ac3b5
    }

    .chip button {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 11px;
      flex-shrink: 0;
      opacity: .6
    }

    .chip button:hover {
      opacity: 1;
      background: #fecaca
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      border: 1px dashed #b9e2da;
      border-radius: 14px;
      padding: 18px;
      color: #557471;
      font-size: 13px;
      background: #f4fbfa
    }

    .toast {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom));
      right: 22px;
      background: #0f766e;
      color: #fff;
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      z-index: 60
    }

    .toast.show {
      opacity: 1;
      transform: none
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(15, 60, 58, .4);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity .18s
    }

    .ov.show {
      opacity: 1;
      visibility: visible
    }

    .box {
      background: #fff;
      border-radius: 20px;
      padding: 26px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25)
    }

    .box h3 {
      margin: 0 0 8px;
      color: #0f766e;
      font-size: 17px
    }

    .box p {
      margin: 0 0 20px;
      font-size: 13.5px;
      color: #3c615e;
      line-height: 1.5
    }

    .acts {
      display: flex;
      justify-content: flex-end;
      gap: 10px
    }

    .acts button {
      border-radius: 11px;
      padding: 9px 16px;
      font-weight: 700;
      font-size: 13px
    }

    .cancel {
      background: #eef6f4;
      color: #3c615e
    }

    .ok {
      background: #ef4444;
      color: #fff
    }

    #file {
      display: none
    }

    /* ---------- Mode toggle (header): round knob slides, the active mode's name hides under it ---------- */
    .seg {
      position: relative;
      isolation: isolate;
      display: grid;
      flex-shrink: 0;
      height: 36px;
      padding: 0;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(180deg, #e0f3ef, #cfeae4);
      box-shadow: inset 0 2px 5px rgba(15, 60, 58, .16), inset 0 0 0 1px #b9ddd6, 0 1px 0 #ffffffcc;
      transition: box-shadow .3s
    }

    .seg:hover {
      box-shadow: inset 0 2px 5px rgba(15, 60, 58, .16), inset 0 0 0 1px #8bd8cd, 0 1px 0 #ffffffcc
    }

    .seg:focus-visible {
      outline: 3px solid #2ac3b555;
      outline-offset: 2px
    }

    .seg .thumb {
      position: absolute;
      z-index: 0;
      top: 3px;
      left: 3px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f9d8f, #2ac3b5);
      box-shadow: 0 6px 14px -4px rgba(15, 157, 143, .7), inset 0 1px 0 rgba(255, 255, 255, .35);
      transition: left .38s cubic-bezier(.34, 1.2, .5, 1)
    }

    .seg .thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      opacity: .9
    }

    body.online .seg .thumb {
      left: calc(100% - 33px)
    }

    .opt {
      grid-area: 1 / 1;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font-size: 12.5px;
      font-weight: 700;
      color: #0f766e;
      white-space: nowrap;
      user-select: none;
      transition: opacity .3s, color .25s
    }

    /* the name of the current mode is shown next to the knob (knob left: name on the right, and the other way round) */
    #lblOwn {
      padding-left: 44px
    }

    #lblOnline {
      padding-right: 44px
    }

    .opt:not(.active) {
      opacity: 0;
      pointer-events: none
    }

    /* System mode: only the two cards and the NEXT / REVEAL button */
    body.online .prog,
    body.online #rndBtn,
    body.online .tools,
    body.online .toggle,
    body.online #panel {
      display: none !important
    }

    /* ================= RESPONSIVE ================= */

    /* Large desktops / wide monitors */
    @media(min-width:1200px) {
      main {
        max-width: 1100px
      }

      .card {
        height: clamp(150px, 26vh, 240px)
      }

      .txt {
        font-size: clamp(32px, 3.4vw, 50px)
      }

      .btn {
        font-size: 14px
      }
    }

    @media(min-width:1700px) {
      main {
        max-width: 1280px
      }

      .txt {
        font-size: clamp(40px, 3vw, 60px)
      }

      .chip {
        font-size: 14px;
        padding: 11px 14px
      }
    }

    /* Laptops / small desktops / tablet landscape */
    @media(max-width:1024px) {
      main {
        max-width: 860px
      }
    }

    /* Tablets */
    @media(max-width:900px) {
      #list {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

      /* Tablets and everything smaller: word card on top, meaning card below */
      .cards {
        flex-direction: column;
        align-items: stretch;
        gap: 8px
      }

      .card {
        flex: none;
        width: 100%;
        height: clamp(110px, 19vh, 190px)
      }

      .arrow {
        align-self: center;
        transform: rotate(90deg)
      }

      /* tool buttons sit in 2 columns; the tutorial button goes last, full width */
      .tools {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px
      }

      .tools #tutBtn {
        grid-column: 1 / -1;
        order: 5
      }
    }

    /* Large phones / small tablets portrait */
    @media(max-width:700px) {
      #list {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      :root {
        --h: 62px
      }

      .header-stage {
        padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left))
      }

      header {
        padding: 7px 12px;
        border-radius: 14px;
        flex-wrap: nowrap
      }

      h1 {
        font-size: 18px
      }

      .header-right .btn {
        padding: 9px 12px
      }

      main {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right))
      }

      .card {
        border-radius: 22px
      }

      .arrow {
        width: 32px;
        height: 32px;
        font-size: 15px
      }

      .btn {
        padding: 11px 14px
      }

      .add input {
        font-size: 16px
      }

      .toast {
        left: 14px;
        right: 14px;
        text-align: center
      }
    }

    /* Header toggle on small screens */
    @media(max-width:700px) {
      .opt {
        padding: 0 12px;
        font-size: 11.5px
      }

      #lblOwn {
        padding-left: 42px
      }

      #lblOnline {
        padding-right: 42px
      }
    }

    @media(max-width:360px) {
      .opt {
        padding: 0 8px;
        font-size: 11px
      }

      #lblOwn {
        padding-left: 40px
      }

      #lblOnline {
        padding-right: 40px
      }
    }

    /* Phones */
    @media(max-width:560px) {
      .tools {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px
      }

      .row .btn {
        flex: 1 1 140px;
        max-width: none
      }

      .box {
        padding: 22px
      }
    }

    /* Small phones */
    @media(max-width:480px) {
      .card {
        height: clamp(96px, 17vh, 140px)
      }

      .txt {
        font-size: clamp(24px, 8vw, 34px)
      }

      #nextBtn {
        order: -1
      }

      .row .btn {
        flex: 1 1 100%
      }

      .add .btn {
        flex: 1 1 100%
      }
    }

    @media(max-width:420px) {
      #list {
        grid-template-columns: 1fr
      }

      h1 {
        font-size: 17px
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        font-size: 13px;
        border-radius: 11px
      }

      .brand {
        gap: 9px
      }

      .brand-sub {
        font-size: 10.5px
      }

      .tools .btn {
        font-size: 12px;
        padding: 10px 8px
      }

      :root {
        --h: 58px
      }
    }

    /* Very small phones (360px and below) */
    @media(max-width:360px) {
      h1 {
        font-size: 16px
      }

      .header-right .btn {
        padding: 8px 10px;
        font-size: 12px
      }

      .tools .btn {
        font-size: 11.5px;
        gap: 4px
      }

      .count {
        font-size: 12px;
        min-width: 38px
      }
    }

    /* Phones held sideways / any short screen */
    @media(max-height:560px) and (orientation:landscape) {
      :root {
        --h: 58px
      }

      .top {
        min-height: auto;
        gap: 10px;
        padding-top: 14px
      }

      .mid {
        gap: 10px
      }

      .card {
        height: 88px
      }

      .txt {
        font-size: clamp(22px, 4vw, 32px)
      }

      .cards {
        gap: 4px
      }

      .arrow {
        width: 26px;
        height: 26px;
        font-size: 13px
      }

      .header-stage {
        padding-top: max(4px, env(safe-area-inset-top))
      }

      header {
        padding-top: 5px;
        padding-bottom: 5px
      }

      .brand-sub {
        display: none
      }
    }

    /* Touch devices: bigger tap targets, no sticky hover colours */
    @media(hover:none) and (pointer:coarse) {
      .btn {
        min-height: 44px
      }

      .toggle {
        min-height: 44px
      }

      .chip button {
        width: 32px;
        height: 32px;
        font-size: 13px;
        opacity: 1
      }

      .add input {
        min-height: 44px
      }

      .acts button {
        min-height: 42px
      }

      .btn:hover {
        background: #1fb4a6
      }

      .ghost:hover {
        background: #e8fbf8;
        color: #0f766e
      }

      .danger:hover {
        background: #fff1f2;
        color: #b91c1c
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        scroll-behavior: auto !important
      }
    }

    /* ---------- Search (header, both modes) ---------- */
    .search {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      width: clamp(180px, 22vw, 250px);
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #f4fbfa);
      box-shadow: inset 0 0 0 1px #cfe7e2, 0 1px 2px rgba(15, 60, 58, .06);
      transition: box-shadow .2s
    }

    .search:focus-within {
      box-shadow: inset 0 0 0 1px #2ac3b5, 0 0 0 3px #2ac3b530
    }

    .s-ico {
      position: absolute;
      left: 4px;
      top: 0;
      bottom: 0;
      width: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #5a8a85;
      border-radius: 50%;
      cursor: text
    }

    .s-ico svg {
      width: 16px;
      height: 16px
    }

    .search input {
      width: 100%;
      height: 100%;
      padding: 0 34px 0 38px;
      border: none;
      border-radius: 999px;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #173c3a
    }

    .search input:focus {
      outline: none;
      box-shadow: none
    }

    .search input::placeholder {
      color: #9dbab6;
      font-weight: 500
    }

    .search input::-webkit-search-cancel-button {
      display: none
    }

    .s-x {
      display: none;
      position: absolute;
      right: 6px;
      top: 6px;
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 50%;
      background: #e8fbf8;
      color: #0f766e;
      font-size: 11px;
      align-items: center;
      justify-content: center
    }

    .search.has-text .s-x {
      display: flex
    }

    .results {
      position: absolute;
      top: calc(100% + 8px);
      z-index: 40;
      padding: 6px;
      background: #fff;
      border: 1px solid #cfe7e2;
      border-radius: 16px;
      box-shadow: 0 18px 40px -12px rgba(15, 60, 58, .28), 0 4px 10px rgba(15, 60, 58, .06);
      max-height: min(60vh, 420px);
      overflow: auto
    }

    .results[hidden] {
      display: none
    }

    .res {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 11px;
      background: transparent;
      color: #173c3a;
      font-size: 13.5px;
      text-align: left
    }

    .res:hover,
    .res.on {
      background: #e8fbf8
    }

    .rw {
      font-weight: 800;
      color: #0f766e;
      white-space: nowrap
    }

    .rm {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
      font-weight: 600;
      color: #557471
    }

    .res-none,
    .res-more {
      padding: 10px 12px;
      font-size: 12.5px;
      color: #557471
    }

    /* Tablet and smaller: only the search icon is shown; tapping it turns the header into a search bar */
    @media(max-width:900px) {
      .search {
        width: 36px
      }

      .search input,
      .search .s-x {
        display: none
      }

      .s-ico {
        left: 0;
        width: 36px;
        cursor: pointer
      }

      header.searching .brand,
      header.searching .seg {
        display: none
      }

      header.searching .header-right {
        flex: 1;
        width: 100%
      }

      header.searching .search {
        flex: 1;
        width: auto
      }

      header.searching .search input {
        display: block
      }

      header.searching .s-x {
        display: flex
      }
    }

    @media(max-width:360px) {
      .search {
        width: 34px
      }

      .s-ico {
        width: 34px
      }
    }

    /* Very narrow phones (320px): give the title more room */
    @media(max-width:340px) {
      .brand-mark {
        width: 30px;
        height: 30px;
        font-size: 12px;
        border-radius: 10px
      }

      .brand {
        gap: 7px
      }

      h1 {
        font-size: 15px
      }

      .header-right {
        gap: 6px
      }

      header {
        padding-left: 9px;
        padding-right: 9px
      }

      .opt {
        padding: 0 6px;
        font-size: 10.5px
      }

      #lblOwn {
        padding-left: 36px
      }

      #lblOnline {
        padding-right: 36px
      }
    }

  <div class="header-stage" id="headerStage">
    <header>
      <div class="brand">

      <div class="header-right">
        <div class="search" id="search" role="search">

          <button class="s-x" id="searchX" type="button" aria-label="close">✕</button>
        </div>
        <button class="seg" id="modeSwitch" role="switch" aria-checked="false" aria-label="মোড পরিবর্তন করুন">
          <span class="thumb"></span>
          <span class="opt active" id="lblOwn">নিজস্ব মোড</span>
          <span class="opt" id="lblOnline">সিস্টেম মোড</span>
        </button>
      </div>
    </header>
    <div class="results" id="results" hidden></div>
  </div>

  <main>
    <section class="top">
      <div class="mid">
        <div class="cards">
          <div class="card"><small>Word</small>
            <div class="txt" id="wordTxt"></div>
          </div>
          <div class="arrow">➜</div>
          <div class="card mean" id="meanCard"><small>অর্থ</small>
            <div class="q">?</div>
            <div class="txt" id="meanTxt"></div>
          </div>
        </div>

        <div class="prog">
          <div class="track">
            <div class="bar" id="bar"></div>
          </div>
          <div class="count" id="count">0/0</div>
        </div>

        <div class="row">
          <button class="btn" id="rndBtn">🎲 Random Next Word</button>
          <button class="btn" id="nextBtn"> NEXT / REVEAL ➜</button>
        </div>

      </div>
      <div class="row tools">
        <!-- Tutorial video link is in the href below -->
        <a class="btn ghost" id="tutBtn" href="https://youtu.be/YLslsZuEaNE?si=GSrcprl7ST4Q4LP3" target="_blank" rel="noopener noreferrer">টিউটোরিলা
          <svg class="yt" viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#ff0000"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>
        </a>
        <button class="btn ghost" id="shufBtn"> Shuffle words ⇄</button>
        <button class="btn ghost" id="impBtn">⭳ Import words</button>
        <button class="btn ghost" id="expBtn">⭱ Export words</button>
        <button class="btn danger" id="resetBtn">↺ Reset All</button>
        <input type="file" id="file" accept=".json,application/json">
      </div>

      <button class="toggle" id="toggle">Expand word list ▾</button>
    </section>

    <div id="panel">
      <div class="panel-inner">
        <div class="panel-body">
      <div class="add">
        <input id="inW" placeholder="word" autocomplete="off">
        <input id="inM" placeholder="meaning" autocomplete="off">
        <button class="btn" id="addBtn" style="background:#2ac3b5">＋ Add words</button>
      </div>
      <div id="list"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <div class="ov" id="ov">
    <div class="box">
      <h3 id="mT"></h3>

      <div class="acts"><button class="cancel" id="mNo">Cancel</button><button class="ok" id="mYes">Confirm</button>
      </div>
    </div>

  </script>

  <script>
    const KEY = 'espanol-vandar_flashcards_v1';
    const DEFAULTS = [
      ['Almuerzo', 'দুপুরের খাবার'], ['Manzana', 'আপেল'], ['Naranja', 'কমলা'],
      ['Verdura', 'শাকসবজি'], ['Pescado', 'মাছ'], ['Galleta', 'বিস্কুট'],
      ['Plátano', 'কলা'], ['Manteca', 'মাখন'], ['Chocolate', 'চকলেট'],
      ['Papas', 'আলু']
    ];
    const fresh = () => ({ words: DEFAULTS.map(([word, meaning]) => ({ word, meaning })), done: [], cur: -1, revealed: false });
    let S = fresh();
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(KEY));
        if (d && Array.isArray(d.words)) S = Object.assign(S, d);
      } catch (e) { }
      S.done = S.done.filter(i => i < S.words.length);
      if (S.cur >= S.words.length) { S.cur = -1; S.revealed = false; }
    }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }

    function render(rebuild = true) {
      const n = S.words.length, w = S.words[S.cur];
      const wt = $('wordTxt');
      wt.textContent = w ? w.word : (n ? 'Press NEXT to start' : 'No words yet — import or add');
      wt.classList.toggle('hint', !w);
      $('meanTxt').textContent = w ? w.meaning : '';
      $('meanCard').classList.toggle('covered', !(w && S.revealed));
      $('bar').style.width = (n ? S.done.length / n * 100 : 0) + '%';
      $('count').textContent = S.done.length + '/' + n;
      if (!rebuild) { [...$('list').children].forEach((c, i) => c.classList.toggle('on', i === S.cur)); return; }
      $('list').innerHTML = n
        ? S.words.map((x, i) => `<div class="chip${i === S.cur ? ' on' : ''}"><span>${i + 1}. ${esc(x.word)} – ${esc(x.meaning)}</span><button data-i="${i}" title="Delete">✕</button></div>`).join('')
        : '<div class="empty">No words yet. Add words above or import a .json file.</div>';
    }

    function toast(m) {
      const t = $('toast'); t.textContent = m; t.classList.add('show');
      clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
    }
    function ask(title, msg) {
      return new Promise(res => {
        $('mT').textContent = title; $('mP').textContent = msg; $('ov').classList.add('show');
        const end = v => { $('ov').classList.remove('show'); $('mYes').onclick = $('mNo').onclick = null; res(v); };
        $('mYes').onclick = () => end(true); $('mNo').onclick = () => end(false);
      });
    }

    // NEXT / REVEAL: show word -> reveal meaning -> next word -> ... -> restart
    function next() {
      const n = S.words.length;
      if (!n) return toast('Add or import words first');
      if (S.cur >= 0 && !S.revealed) {
        S.revealed = true;
        if (!S.done.includes(S.cur)) S.done.push(S.cur);
      } else {
        if (S.done.length >= n) { S.done = []; S.cur = -1; }
        let k = -1;
        for (let j = 1; j <= n; j++) {
          const i = (S.cur + j) % n;
          if (!S.done.includes(i)) { k = i; break; }
        }
        S.cur = k; S.revealed = false;
      }
      save(); render(false);
    }

    function rnd() {
      const n = S.words.length;
      if (!n) return toast('Add or import words first');
      if (S.done.length >= n) S.done = [];
      const all = [...Array(n).keys()];
      let pool = all.filter(i => !S.done.includes(i) && i !== S.cur);
      if (!pool.length) pool = all.filter(i => i !== S.cur);
      if (!pool.length) pool = [0];
      S.cur = pool[Math.floor(Math.random() * pool.length)];
      S.revealed = false; save(); render(false);
    }

    function shuffle() {
      const n = S.words.length;
      if (n < 2) return toast('Need at least 2 words to shuffle');
      const doneW = S.done.map(i => S.words[i]), curW = S.words[S.cur];
      for (let i = n - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [S.words[i], S.words[j]] = [S.words[j], S.words[i]];
      }
      S.done = doneW.map(w => S.words.indexOf(w));
      S.cur = curW ? S.words.indexOf(curW) : -1;
      save(); render(); toast('Words shuffled');
    }

    function addWord() {
      const w = $('inW').value.trim(), m = $('inM').value.trim();
      if (!w || !m) return toast('Write both word and meaning');
      S.words.push({ word: w, meaning: m });
      $('inW').value = $('inM').value = ''; $('inW').focus();
      save(); render(); toast('Word added');
    }

    function setOpen(open) {
      document.body.classList.toggle('open', open);
      $('toggle').textContent = open ? 'Close word list ▴' : 'Expand word list ▾';
    }

    $('nextBtn').onclick = go;
    $('rndBtn').onclick = rnd;
    $('shufBtn').onclick = shuffle;
    $('addBtn').onclick = addWord;
    $('inM').addEventListener('keydown', e => { if (e.key === 'Enter') addWord(); });
    $('inW').addEventListener('keydown', e => { if (e.key === 'Enter') $('inM').focus(); });
    $('toggle').onclick = () => setOpen(!document.body.classList.contains('open'));

    $('list').addEventListener('click', e => {
      const b = e.target.closest('button[data-i]'); if (!b) return;
      const k = +b.dataset.i;
      S.words.splice(k, 1);
      S.done = S.done.filter(i => i !== k).map(i => i > k ? i - 1 : i);
      if (S.cur === k) { S.cur = -1; S.revealed = false; } else if (S.cur > k) S.cur--;
      save(); render();
    });

    $('resetBtn').onclick = async () => {
      if (!await ask('Reset everything?', 'All saved words and progress in this browser will be deleted and the 10 default words will come back. Export a backup first if you are not sure.')) return;
      try { localStorage.removeItem(KEY); } catch (e) { }
      S = fresh();
      render(); toast('Reset to default words');
    };

    $('expBtn').onclick = () => {
      if (!S.words.length) return toast('No words to export');
      const blob = new Blob([JSON.stringify(S.words, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'espanol-vandar-words-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Words exported');
    };

    $('impBtn').onclick = () => $('file').click();
    $('file').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const d = JSON.parse(r.result);
          const arr = (Array.isArray(d) ? d : []).filter(x => x && x.word && x.meaning)
            .map(x => ({ word: String(x.word).trim(), meaning: String(x.meaning).trim() }));
          if (!arr.length) throw new Error('empty');
          if (S.words.length && !await ask('Import this file?', 'This replaces the current word list and progress with ' + arr.length + ' words from the file.')) { e.target.value = ''; return; }
          S = { words: arr, done: [], cur: -1, revealed: false };
          save(); render(); toast(arr.length + ' words imported');
        } catch (err) {
          await ask('Could not read file', 'Use a .json file shaped like: [{"word":"Casa","meaning":"বাড়ি"}]');
        }
        e.target.value = '';
      };
      r.readAsText(f);
    });

    const typing = e => /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.id === 'modeSwitch' || e.target.id === 'searchBtn' || e.target.id === 'searchX';
    const isSpace = e => e.code === 'Space' || e.key === ' ';
    document.addEventListener('keydown', e => {
      if (!isSpace(e) || typing(e) || $('ov').classList.contains('show')) return;
      e.preventDefault();
      if (!e.repeat) go();
    });
    document.addEventListener('keyup', e => {
      if (isSpace(e) && !typing(e) && !$('ov').classList.contains('show')) e.preventDefault();
    });

    // Header shrinks on scroll (same behaviour as the CGPA dashboard)
    const headerStage = $('headerStage');
    window.addEventListener('scroll', () => {
      headerStage.classList.toggle('scrolled', window.scrollY > 12);
    }, { passive: true });

    // ================= System mode =================
    const MODE_KEY = 'espanol-vandar_mode_v1'; // no longer used; the old value is removed on start
    let mode = 'own';
    const O = { cur: null, revealed: false, busy: false, error: false, queue: [], filling: false, seen: new Set(), pool: null, poolAt: 0 };
    const cap = w => w.charAt(0).toUpperCase() + w.slice(1);

    // System mode works completely offline: every word and its Bengali meaning is stored in this file (#wordData)
    function getPool() {
      if (!O.pool) {
        O.pool = document.getElementById('wordData').textContent.split('\n').map(l => l.trim()).filter(Boolean)
          .map(l => { const k = l.indexOf('\t'); return { w: l.slice(0, k), m: l.slice(k + 1) }; });
      }
      return O.pool;
    }

    function renderOnline() {
      if (mode !== 'online') return;
      const c = O.cur, wt = $('wordTxt');
      wt.textContent = c ? c.word : 'Press NEXT to start';
      wt.classList.toggle('hint', !c);
      $('meanTxt').textContent = c ? c.meaning : '';
      $('meanCard').classList.toggle('covered', !(c && O.revealed));
    }

    // NEXT / REVEAL in system mode: new word -> reveal meaning -> next new word ...
    function onlineNext() {
      if (O.cur && !O.revealed) { O.revealed = true; renderOnline(); return; }
      const pool = getPool();
      if (O.seen.size >= pool.length) O.seen.clear();
      let e, t = 0;
      do { e = pool[Math.floor(Math.random() * pool.length)]; t++; } while (O.seen.has(e.w) && t < 100);
      O.seen.add(e.w);
      O.cur = { word: cap(e.w), meaning: e.m };
      O.revealed = false;
      renderOnline();
    }

    function go() { return mode === 'online' ? onlineNext() : next(); }

    function setMode(m) {
      mode = m;
      closeSearch(true);
      document.body.classList.toggle('online', m === 'online');
      $('modeSwitch').setAttribute('aria-checked', m === 'online');
      $('lblOwn').classList.toggle('active', m === 'own');
      $('lblOnline').classList.toggle('active', m === 'online');
      if (m === 'online') renderOnline(); else render();
    }
    // clicking anywhere on the switch flips the mode
    $('modeSwitch').onclick = () => setMode(mode === 'online' ? 'own' : 'online');

    // ================= Search (both modes) =================
    const searchEl = $('search'), searchIn = $('searchIn'), resEl = $('results'), hdr = document.querySelector('header');
    const strip = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const isSmall = () => window.matchMedia('(max-width:900px)').matches;
    let sIndex = null, sHits = [], sActive = -1;

    function searchSource() {
      if (mode === 'online') {
        if (!sIndex) sIndex = getPool().map(e => ({ w: cap(e.w), raw: e.w, m: e.m, nw: strip(e.w), nm: e.m.toLowerCase() }));
        return sIndex;
      }
      return S.words.map((x, i) => ({ w: x.word, m: x.meaning, nw: strip(x.word), nm: x.meaning.toLowerCase(), i }));
    }

    function placeResults() {
      const st = $('headerStage').getBoundingClientRect(), hr = hdr.getBoundingClientRect();
      if (isSmall()) {
        resEl.style.left = (hr.left - st.left) + 'px'; resEl.style.right = (st.right - hr.right) + 'px'; resEl.style.width = 'auto';
      } else {
        const r = searchEl.getBoundingClientRect(), w = Math.min(Math.max(r.width, 340), hr.width);
        const left = Math.min(r.left - st.left, hr.right - st.left - w);
        resEl.style.left = left + 'px'; resEl.style.right = 'auto'; resEl.style.width = w + 'px';
      }
    }

    function closeResults() { resEl.hidden = true; sActive = -1; sHits = []; }

    function closeSearch(clear) {
      hdr.classList.remove('searching');
      if (clear) { searchIn.value = ''; searchEl.classList.remove('has-text'); }
      closeResults();
      searchIn.blur();
    }

    function markActive() {
      [...resEl.querySelectorAll('.res')].forEach((b, k) => b.classList.toggle('on', k === sActive));
      const a = resEl.querySelector('.res.on'); if (a) a.scrollIntoView({ block: 'nearest' });
    }

    function runSearch() {
      const q = searchIn.value.trim();
      searchEl.classList.toggle('has-text', !!q);
      if (!q) { closeResults(); return; }
      const nq = strip(q), lq = q.toLowerCase(), b = [[], [], [], []];
      for (const e of searchSource()) {
        if (e.nw === nq) b[0].push(e);
        else if (e.nw.startsWith(nq)) b[1].push(e);
        else if (e.nw.includes(nq)) b[2].push(e);
        else if (e.nm.includes(lq)) b[3].push(e);
      }
      const all = [].concat(b[0], b[1], b[2], b[3]);
      sHits = all.slice(0, 8); sActive = -1;
      resEl.innerHTML = sHits.length
        ? sHits.map((e, k) => `<button type="button" class="res" data-k="${k}"><span class="rw">${esc(e.w)}</span><span class="rm">${esc(e.m)}</span></button>`).join('')
          + (all.length > 8 ? `<div class="res-more">আরও ${all.length - 8}টি মিল আছে, আরও নির্দিষ্ট করে লিখুন</div>` : '')
        : '<div class="res-none">কিছু পাওয়া যায়নি</div>';
      placeResults(); resEl.hidden = false;
    }

    function pickHit(k) {
      const e = sHits[k]; if (!e) return;
      if (mode === 'online') {
        O.cur = { word: e.w, meaning: e.m }; O.revealed = true; O.seen.add(e.raw); renderOnline();
      } else {
        S.cur = e.i; S.revealed = true; save(); render(false);
      }
      closeSearch(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    searchIn.addEventListener('input', runSearch);
    searchIn.addEventListener('focus', () => { if (searchIn.value.trim()) runSearch(); });
    searchIn.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!sHits.length) return;
        e.preventDefault();
        sActive = e.key === 'ArrowDown' ? (sActive + 1) % sHits.length : (sActive <= 0 ? sHits.length - 1 : sActive - 1);
        markActive();
      } else if (e.key === 'Enter') {
        if (sHits.length) { e.preventDefault(); pickHit(sActive >= 0 ? sActive : 0); }
      } else if (e.key === 'Escape') { closeSearch(true); }
    });
    resEl.addEventListener('click', e => { const b = e.target.closest('.res'); if (b) pickHit(+b.dataset.k); });
    $('searchBtn').addEventListener('click', () => {
      if (isSmall()) hdr.classList.add('searching');
      searchIn.focus();
    });
    $('searchX').addEventListener('click', () => {
      if (isSmall()) { closeSearch(true); return; }
      searchIn.value = ''; runSearch(); searchIn.focus();
    });
    document.addEventListener('click', e => {
      if (searchEl.contains(e.target) || resEl.contains(e.target)) return;
      closeResults();
      if (isSmall() && !searchIn.value.trim()) hdr.classList.remove('searching');
    });
    window.addEventListener('resize', () => {
      if (!isSmall()) hdr.classList.remove('searching');
      if (!resEl.hidden) placeResults();
    });

    load(); render();
    try { localStorage.removeItem(MODE_KEY); ['espanol-vandar_pool_v1', 'espanol-vandar_pool_v2'].forEach(k => localStorage.removeItem(k)); } catch (e) { }
    setMode('own'); // page always opens in own-words mode; nothing about online mode is stored
  </script>
